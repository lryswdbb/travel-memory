<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我们的旅行记忆</title>
<link rel="stylesheet" href="css/style.css?v=11">
</head>
<body>

<!-- 错误可视化：任何脚本错误直接显示在屏幕上，不再默默黑屏 -->
<div id="err-overlay" style="display:none;position:fixed;z-index:99999;left:0;right:0;bottom:0;max-height:45vh;overflow:auto;background:rgba(120,10,20,.92);color:#ffe8e8;font:13px/1.6 Consolas,monospace;padding:12px 16px;white-space:pre-wrap;"></div>
<script>
(function () {
  function showErr(msg) {
    var el = document.getElementById('err-overlay');
    if (!el) return;
    el.style.display = 'block';
    el.textContent += '⚠ ' + msg + '\n';
  }
  window.addEventListener('error', function (e) {
    showErr((e.message || '未知错误') + '  @' + (e.filename || '').split('/').pop() + ':' + (e.lineno || 0));
  });
  window.addEventListener('unhandledrejection', function (e) {
    showErr('Promise 异常: ' + ((e.reason && e.reason.message) || e.reason));
  });
})();
</script>

<!-- ========== 封面 ========== -->
<div id="scene-cover" class="scene active visible">
  <canvas id="cover-stars"></canvas>
  <div class="cover-content">
    <h1 class="cover-title">我们的旅行记忆</h1>
    <p class="cover-sub">OUR TRAVEL MEMORIES</p>
    <button id="btn-enter" class="btn-enter">点击进入</button>
    <button id="btn-cover-auth" class="cover-auth" title="登录后可创建/加入共享房间">登录 / 房间</button>
  </div>
</div>

<!-- ========== 星际穿梭 ========== -->
<div id="scene-warp" class="scene">
  <canvas id="warp-canvas"></canvas>
  <div id="warp-hint" class="warp-hint">正在穿越星系，抵达地球…</div>
  <div id="warp-earth-label" class="warp-earth-label">地球 · EARTH</div>
  <button id="warp-skip" class="warp-skip">跳过动画 →</button>
  <!-- 抵达态：可交互卫星地球 UI -->
  <div id="warp-ui" class="warp-ui">
    <div class="warp-ui-title">地球 · EARTH</div>
    <div class="warp-ui-hint">拖动旋转 · 滚轮缩放 · 双击画面也可进入</div>
    <button id="warp-enter" class="warp-enter">进入地图 →</button>
  </div>
</div>

<!-- ========== 地图 ========== -->
<div id="scene-map" class="scene">
  <div id="map-breadcrumb" class="breadcrumb">
    <span class="crumb-link" data-level="world">🌍 世界</span>
  </div>
  <div id="map-chart"></div>
  <button id="btn-stats" class="btn-stats" title="查看旅行足迹统计">📊 足迹</button>
  <button id="btn-carousel" class="btn-carousel" title="照片走马灯">🎞</button>
  <div id="map-tip" class="map-tip">点击任意区域，收藏你们的旅行记忆</div>
  <div id="map-legend" class="map-legend">
    <span class="dot visited"></span>已有记忆
    <span class="dot"></span>未探索
  </div>
</div>

<!-- ========== 旅行足迹统计 ========== -->
<div id="scene-stats" class="scene">
  <div class="stats-content">
    <div class="gallery-head">
      <button id="stats-back" class="btn-back">← 返回地图</button>
      <div class="gallery-title">
        <h2>旅行足迹</h2>
        <p>OUR FOOTPRINTS</p>
      </div>
      <span class="head-spacer"></span>
    </div>
    <div id="stats-body" class="stats-body"></div>
  </div>
</div>

<!-- ========== 照片墙 ========== -->
<div id="scene-gallery" class="scene">
  <div id="gallery-bg"></div>
  <div id="gallery-overlay"></div>
  <div class="gallery-content">
    <div class="gallery-head">
      <button id="btn-back" class="btn-back">← 返回地图</button>
      <div class="gallery-title">
        <h2 id="gallery-name">—</h2>
        <p id="gallery-landmark"></p>
      </div>
      <button id="btn-gallery-carousel" class="btn-car-mini" title="走马灯浏览这里的照片">🎞</button>
      <label class="btn-upload">
        + 添加照片
        <input type="file" id="file-input" accept="image/*" multiple hidden>
      </label>
    </div>
    <div id="gallery-grid" class="gallery-grid"></div>
    <div id="gallery-empty" class="gallery-empty">
      还没有关于这里的记忆<br>
      <span>点击右上角「添加照片」，上传第一张照片吧</span>
    </div>
  </div>
</div>

<!-- ========== 登录（用户名 + 密码） ========== -->
<div id="scene-auth" class="scene">
  <div class="auth-wrap">
    <div class="auth-panel">
      <h2 class="auth-title">登录 / 注册</h2>
      <p class="auth-sub">创建自己的账号，解锁云端共享房间</p>

      <!-- 登录 / 注册 -->
      <div id="auth-step-login">
        <label class="auth-label">用户名
          <input id="auth-username" class="auth-input" type="text" maxlength="20" placeholder="给自己起个名字（中英文都行）" autocomplete="username">
        </label>
        <label class="auth-label">密码
          <input id="auth-password" class="auth-input" type="password" placeholder="至少 6 位" autocomplete="current-password">
        </label>
        <button id="auth-register" class="auth-btn">✨ 创建账号并开始使用</button>
        <button id="auth-login" class="auth-btn ghost auth-login-btn">已有账号，登录</button>
        <p class="auth-note">首次使用点「创建账号」即可，无需邮箱；<br>不登录也可以继续用「个人模式」（照片存本机）</p>
      </div>

      <!-- 已登录 -->
      <div id="auth-step-user" hidden>
        <p class="auth-who-box">👤 <span id="auth-who"></span></p>
        <button id="auth-continue" class="auth-btn">继续 → 解锁房间功能</button>
        <button id="auth-signout" class="auth-btn ghost auth-login-btn">退出登录</button>
      </div>

      <div id="auth-err" class="auth-err"></div>
      <button id="auth-back" class="auth-back">← 返回</button>
    </div>
  </div>
</div>

<!-- ========== 照片走马灯 ========== -->
<div id="scene-carousel" class="scene">
  <div class="car-head">
    <button id="car-back" class="btn-back">← 返回</button>
    <div class="gallery-title">
      <h2 id="car-title">走马灯</h2>
      <p>MEMORY CAROUSEL · 拖动甩一甩，点击看大图</p>
    </div>
    <div id="car-filter" class="car-filter">
      <button class="car-chip active" data-f="all">全部</button>
      <button class="car-chip" data-f="today">今天</button>
      <button class="car-chip" data-f="week">本周</button>
      <button class="car-chip" data-f="month">本月</button>
      <button class="car-chip" data-f="dated">有日期</button>
      <input id="car-date" class="car-date" type="date" title="跳到指定日期">
    </div>
  </div>
  <div id="car-viewport" class="car-viewport">
    <div id="car-track" class="car-track"></div>
  </div>
  <div id="car-count" class="car-count"></div>
</div>

<!-- 照片查看大图 -->
<div id="lightbox" class="lightbox">
  <img id="lightbox-img" alt="">
  <div id="lightbox-cap"></div>
  <button id="lightbox-prev" class="lb-nav lb-prev" title="上一张 (←)">‹</button>
  <button id="lightbox-next" class="lb-nav lb-next" title="下一张 (→)">›</button>
  <div id="lightbox-count"></div>
  <div class="lightbox-close">✕</div>
</div>

<script src="assets/three.min.js"></script>
<script src="assets/echarts.min.js"></script>
<script src="assets/topojson.min.js"></script>
<!-- Supabase（云端房间）；CDN 失败不影响个人模式 -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js" crossorigin="anonymous"></script>
<script src="js/config.js?v=11"></script>
<script src="data/js/world.js"></script>
<script src="data/js/china_provinces.js"></script>
<script src="data/js/us_states.js"></script>
<script src="data/js/us_counties.js"></script>
<!-- 全球省/州索引（各国边界文件 prov_<iso>.js 由 map.js 按需懒加载） -->
<script src="data/js/prov_index.js?v=11"></script>
<script src="js/landmarks.js?v=11"></script>
<script src="js/warp.js?v=11"></script>
<script src="js/map.js?v=11"></script>
<script src="js/gallery.js?v=11"></script>
<script src="js/auth.js?v=11"></script>
<script src="js/rooms.js?v=11"></script>
<script src="js/carousel.js?v=11"></script>
<script src="js/stats.js?v=11"></script>
<script src="js/main.js?v=11"></script>
</body>
</html>
